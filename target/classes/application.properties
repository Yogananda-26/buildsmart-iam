
spring.datasource.url=jdbc:mysql://localhost:3306/Reporting
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always
server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.application.name=report-analytics-service

# IAM Service direct URL (used when Eureka is unavailable)
iam.service.url=http://localhost:8082
iam.username=root
iam.password=root

# Feign Circuit Breaker — enabled for fallback support
spring.cloud.openfeign.circuitbreaker.enabled=true

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.projectService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.projectService.wait-duration-in-open-state=5000
resilience4j.circuitbreaker.instances.projectService.sliding-window-size=10

# Feign logging (DEBUG level to see Feign request/response details)
logging.level.com.buildsmart.analytics.client=DEBUG
logging.level.feign=DEBUG

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000